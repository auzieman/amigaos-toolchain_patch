<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
<rect width="1280" height="820" fill="#111923"/>
<g font-family="DejaVu Sans,sans-serif" fill="#e8f0f5">
<text x="48" y="60" font-size="30" font-weight="bold">A1222 / SPE - Mandelbrot comparison</text>
<text x="48" y="94" font-size="17" fill="#aebdcb">QEMU 10.0.13 TCG / e500v2 / Linux 6.12.113 / single render thread</text>
<text x="48" y="138" font-size="23" fill="#ffbd69">Software floating point</text>
<image x="48" y="154" width="568" height="426" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="48" y="620" font-size="30" fill="#ffbd69">446.341 ms median</text>
<rect x="48" y="640" width="520.00" height="12" rx="6" fill="#ffbd69"/>
<text x="664" y="138" font-size="23" fill="#73e0ad">SPE instructions</text>
<image x="664" y="154" width="568" height="426" href="data:image/png;base64," style="image-rendering:pixelated"/>
<text x="664" y="620" font-size="30" fill="#73e0ad">173.063 ms median</text>
<rect x="664" y="640" width="201.62" height="12" rx="6" fill="#73e0ad"/>
<text x="48" y="700" font-size="25" fill="#73e0ad">2.58x SPE speedup in this run - images match byte-for-byte</text>
<text x="48" y="735" font-size="16">128 x 96 pixels, max 96 iterations. One warmup and three measured trials per path.</text>
<text x="48" y="764" font-size="16" fill="#aebdcb">Guest render timing only. QEMU results are not physical A1222 performance.</text>
<text x="48" y="793" font-size="16" fill="#aebdcb">Explicit SPE vs GNU software FP; no GL, libc or restored compiler SPE ABI.</text>
</g></svg>
