[binaries]
c = '/tools/cxx-reference-002/bin/powerpc-linux-gnuspe-gcc'
ar = '/tools/cxx-reference-002/bin/powerpc-linux-gnuspe-ar'
strip = 'powerpc-linux-gnu-strip'
pkg-config = 'pkgconf'
[host_machine]
system = 'linux'
cpu_family = 'ppc'
cpu = 'e500v2'
endian = 'big'
[properties]
needs_exe_wrapper = true
sys_root = '/work/desktop-base-002/stage'
pkg_config_libdir = ['/work/desktop-base-002/stage/usr/lib/pkgconfig']
[built-in options]
c_args = ['--sysroot=/sysroot', '-mcpu=8548', '-mabi=spe', '-mspe', '-mfloat-gprs=double', '-mlong-double-128', '-O2', '-g0', '-I/work/desktop-base-002/stage/usr/include']
c_link_args = ['--sysroot=/sysroot', '-L/work/desktop-base-002/stage/usr/lib']
