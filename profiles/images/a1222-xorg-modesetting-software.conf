# Alternative explicit diagnostic profile, not an automatic fallback.
Section "Device"
    Identifier "A1222SoftwareKMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "SWcursor" "true"
    Option "PageFlip" "false"
EndSection

Section "Screen"
    Identifier "A1222Screen"
    Device "A1222SoftwareKMS"
    DefaultDepth 24
EndSection
