# Explicit diagnostic profile; do not install alongside the modesetting profile.
# Uses the mode already established by AMDGPU/fbcon on candidate007.
Section "Device"
    Identifier "A1222Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "A1222Screen"
    Device "A1222Framebuffer"
    DefaultDepth 24
EndSection
